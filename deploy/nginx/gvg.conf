# Rate limiting zones for DDoS and Brute Force mitigation
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 50M;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Static Build
    location / {
        root /opt/gvg/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Uploaded Static Files (Posters, Floorplan Backgrounds)
    # Strictly isolated with anti-sniffing and CSP sandbox to prevent stored XSS or script execution
    location ^~ /uploads/ {
        alias /opt/gvg/backend/uploads/;
        # Re-declare parent security headers because Nginx add_header in child location suppresses parent inheritance
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=86400" always;

        # Forbid dangerous script / executable execution
        location ~* \.(php|pl|py|cgi|sh|bash|exe|bat|cmd|ps1|vbs|jar|html|htm|shtml)$ {
            return 403;
        }
    }

    # Authentication rate limiting (Login & Token) - 5 requests/minute with burst=5
    location ~ ^/api/v1/auth/(login|token)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API, Docs & Webhooks Reverse Proxy with general rate limit (30 req/s, burst=20)
    location ~ ^/(api|docs|redoc|openapi.json|health|webhooks) {
        limit_req zone=api_general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
