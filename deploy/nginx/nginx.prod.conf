server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 50M;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend Static Build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Uploaded Static Files (Posters, Floorplan Backgrounds)
    # Strictly isolated with anti-sniffing and CSP sandbox to prevent stored XSS or script execution
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        # Re-declare parent security headers because Nginx add_header in child location suppresses parent inheritance
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=86400" always;

        # Forbid dangerous script / executable execution
        location ~* \.(php|pl|py|cgi|sh|bash|exe|bat|cmd|ps1|vbs|jar|html|htm|shtml)$ {
            return 403;
        }
    }

    # Backend API, Docs & Webhooks Reverse Proxy
    location ~ ^/(api|docs|redoc|openapi.json|health|webhooks) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
